name: Decode PNG icons
on:
  push:
    branches: [main]
    paths: ['icons/*.png.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test math
        run: node test/math.test.js
      - name: Decode and commit PNGs
        run: |
          for f in icons/*.png.b64; do base64 -d "$f" > "${f%.b64}"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          git diff --cached --quiet || (git commit -m "Add decoded PNG icons" && git push)
